# Conda-forge base and migrations, followed by rock-the-conda build overrides.
conda_forge_pinning_version: 2026.11.22.17.16.11
migrations:
  - elfutils0196
  - libboost190
pinning_overrides:
  channel_sources: null
  channel_targets: null
  # We build pytorch, so we do not want to pin it here
  pytorch: null
  libtorch: null
  # These packages are built from our local/feedstock recipes too.
  librealsense: null
  libmagma: null
  libmagma_devel: null
  libmagma_sparse: null
  # Also leave the related magma package unpinned.
  magma: null
  # Compiler versions for ROCm HIP and Clang
  clang_compiler_version:
    - 22
  clangxx_compiler_version:
    - 22
  llvmdev:
    - 22
  clangdev:
    - 22
  hip_compiler:
    - hip-rocm-clang
  hip_compiler_version:
    - None
    - '7.2'
  # https://github.com/gbionics/rock-the-conda/pull/26#issuecomment-4164155322
  c_stdlib_version:
    - 2.28
  # Keep compiler/CUDA tuples aligned, but let c_stdlib_version vary independently.
  zip_keys:
                                  # [unix]
    -   - c_compiler_version      # [unix]
        - cxx_compiler_version    # [unix]
        - fortran_compiler_version # [unix]
        - cuda_compiler_version   # [linux and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
    -   - python
        - is_python_min
    -   - libarrow
        - libarrow_all
    -   - root_base
        - root_cxx_standard
    -   - clhep
        - geant4
