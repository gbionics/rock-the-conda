schema_version: 1

context:
  name: rocthrust
  version: "7.2.4"

package:
  name: librocthrust-devel
  version: ${{ version }}

source:
  url: https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/rocthrust.tar.gz
  sha256: 13bf12e70f703144cbc9bb1c384b51e894f1c4fcbc5ea595cd6f235f8aa8f333

build:
  number: 1
  skip:
    - not linux
    - hip_compiler_version in (None, "None")
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('hip') }}
    - cmake
    - ninja
  host:
    - rocm-cmake
    - librocprim-devel ${{ version }}.*
  run:
    - hip-devel
    - librocprim-devel
tests:
  - requirements:
      run:
        - cmake-package-check
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    script:
      - cmake-package-check rocthrust
  - package_contents:
      include:
        - thrust/version.h
        - thrust/rocthrust_version.hpp

about:
  homepage: https://rocm.docs.amd.com/projects/rocThrust
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: "ROCm parallel algorithm library, HIP back-end for Thrust."

extra:
  feedstock-name: rocthrust
  recipe-maintainers:
    - flferretti
    - conda-forge/rocm-core
