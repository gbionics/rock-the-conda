schema_version: 1

context:
  version: "7.2.4"

package:
  name: librocwmma-devel
  version: ${{ version }}

source:
  url: https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/rocwmma.tar.gz
  sha256: 0d92dad3d7e8a16aa0aca9f09c018412630a81312cb0f8a3dae690aea9856049
  patches:
    - 0001-use-standard-clang-flags.patch

build:
  number: 0
  skip:
    - not linux
    - hip_compiler_version in (None, "None")
  script: build.sh

requirements:
  build:
    - ${{ compiler('clang') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('clangxx') }}
    - ${{ compiler('hip') }}
    - cmake
    - ninja
  host:
    - rocm-core ${{ version }}.*
    - rocm-cmake
    - llvm-openmp
  run:
    - hip-devel
    - llvm-openmp
tests:
  - requirements:
      run:
        - cmake-package-check
        - ${{ compiler('clang') }}
        - ${{ compiler('clangxx') }}
    script:
      - cmake-package-check rocwmma --targets roc::rocwmma
  - package_contents:
      include:
        - rocwmma/rocwmma.hpp

about:
  repository: https://github.com/ROCm/rocm-libraries
  homepage: https://rocm.docs.amd.com/projects/rocWMMA/en/latest/
  license: MIT
  license_file: LICENSE.md
  summary: "AMD GPU C++ header-only library for GEMM primitives based on WMMA instructions"

extra:
  feedstock-name: rocwmma
  recipe-maintainers:
    - traversaro
