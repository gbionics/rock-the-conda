schema_version: 1

context:
  name: hiprand
  version: "7.2.4"

recipe:
  name: hiprand-split
  version: ${{ version }}

source:
  url: https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/hiprand.tar.gz
  sha256: c31cec665ee0a7333fd4dfa54d46dd601710a17f56826f1d309aea4333c37360

build:
  number: 1
  skip:
    - not linux
    - hip_compiler_version in (None, "None")

outputs:
  - staging:
      name: hiprand-build
    requirements:
      build:
        - ${{ compiler('clang') }}
        - ${{ stdlib("c") }}
        - ${{ compiler('clangxx') }}
        - ${{ compiler('hip') }}
        - ${{ compiler('fortran') }}
        - cmake
        - ninja
      host:
        - rocm-cmake
        - librocrand-devel
    build:
      script: build.sh

  - package:
      name: libhiprand
    inherit: hiprand-build
    build:
      files:
        include:
          - "**/*"
        exclude:
          - include/**
          - lib/*.a
          - lib/cmake/**
          - lib/pkgconfig/**
          - share/pkgconfig/**
          - share/doc/**
    tests:
      - package_contents:
          lib:
            - hiprand

  - package:
      name: libhiprand-devel
    inherit: hiprand-build
    build:
      files:
        - include/**
        - lib/*.a
        - lib/cmake/**
        - lib/pkgconfig/**
        - share/pkgconfig/**
        - share/doc/**
    requirements:
      run:
        - hip-devel
        - librocrand-devel
        - ${{ pin_subpackage('libhiprand', exact=True) }}

      run_exports:
        - ${{ pin_subpackage('libhiprand', upper_bound='x.x') }}

    tests:
      - package_contents:
          include:
            - hiprand/hiprand.h

about:
  repository: https://github.com/ROCm/hipRAND
  homepage: https://rocm.docs.amd.com/projects/hipRAND/en/latest/
  license: MIT
  license_file: LICENSE.md
  summary: "ROCm RAND marshalling library"
  description: |
    hipRAND is a RAND marshalling library with multiple supported backends.
    It sits between your application and the backend RAND library, where it marshals
    inputs to the backend and results to the application.

extra:
  feedstock-name: hiprand
  recipe-maintainers:
    - flferretti
    - conda-forge/rocm-core
