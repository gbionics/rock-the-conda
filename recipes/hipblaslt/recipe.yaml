schema_version: 1

context:
  name: hipblaslt
  version: "7.2.4"

recipe:
  name: hipblaslt-split
  version: ${{ version }}

source:
  - url: "https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/hipblaslt.tar.gz"
    sha256: 72ad0a8db025c6d47397791a9fce5c80cde1b89fc830523d0b34e5138329de63
    target_directory: projects/hipblaslt
  - url: "https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/origami.tar.gz"
    sha256: f917d10a3a9a8ec2f527c046a90a674a655b007d28132058c20e0fb34f6fcf71
    target_directory: shared/origami

build:
  number: 2
  skip:
    - not linux
    - hip_compiler_version in (None, "None")

outputs:
  - staging:
      name: hipblaslt-build
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - pkg-config
        - ninja
        # Needed for tensilite
        - python ${{ python_min }}.*
        - pip
        - setuptools
        - msgpack-python
        - joblib
        - pyyaml
        - packaging
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake ${{ version }}.*
        - libhipblas-common-devel
        - librocroller-devel ${{ version }}.*
        # Needed for tensilite
        - python ${{ python_min }}.*
        - pip
        - setuptools
        - msgpack-python
        - joblib
        - pyyaml
        - packaging
        - msgpack-cxx
        - libboost-devel
      ignore_run_exports:
        from_package:
          - python
          - libboost-devel
    build:
      script: build.sh

  - package:
      name: libhipblaslt
    inherit:
      from: hipblaslt-build
      run_exports: false
    build:
      files:
        - bin/**
        - lib/libhipblaslt.so*
        - lib/hipblaslt/**
        - share/doc/**
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - pkg-config
        - ninja
        # Needed for tensilite
        - python ${{ python_min }}.*
        - pip
        - setuptools
        - msgpack-python
        - joblib
        - pyyaml
        - packaging
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake ${{ version }}.*
        - libhipblas-common-devel
        - librocroller-devel ${{ version }}.*
        # Needed for tensilite
        - python ${{ python_min }}.*
        - pip
        - setuptools
        - msgpack-python
        - joblib
        - pyyaml
        - packaging
        - msgpack-cxx
        - libboost-devel
      ignore_run_exports:
        from_package:
          - python
          - libboost-devel
    tests:
      - package_contents:
          lib:
            - hipblaslt

  - package:
      name: libhipblaslt-devel
    inherit:
      from: hipblaslt-build
      run_exports: false
    build:
      files:
        - include/**
        - lib/*.a
        - lib/cmake/**
        - lib/pkgconfig/**
        - share/pkgconfig/**
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - pkg-config
        - ninja
        # Needed for tensilite
        - python ${{ python_min }}.*
        - pip
        - setuptools
        - msgpack-python
        - joblib
        - pyyaml
        - packaging
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake ${{ version }}.*
        - libhipblas-common-devel
        - librocroller-devel ${{ version }}.*
        # Needed for tensilite
        - python ${{ python_min }}.*
        - pip
        - setuptools
        - msgpack-python
        - joblib
        - pyyaml
        - packaging
        - msgpack-cxx
        - libboost-devel
      ignore_run_exports:
        from_package:
          - python
          - libboost-devel

      run:
        - hip-devel
        - libhipblas-common-devel
        - librocroller-devel
        - libboost-devel
        - ${{ pin_subpackage('libhipblaslt', exact=True) }}

      run_exports:
        - ${{ pin_subpackage('libhipblaslt', upper_bound='x.x') }}
    tests:
      - requirements:
          run:
            - cmake-package-check
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
        script:
          - cmake-package-check hipblaslt
      - package_contents:
          include:
            - hipblaslt/hipblaslt.h

about:
  homepage: https://rocm.docs.amd.com/projects/hipBLASLt
  repository: https://github.com/ROCm/rocm-libraries
  license: MIT
  license_family: MIT
  license_file: projects/hipblaslt/LICENSE.md
  summary: "HIP library for GEMM operations with extended functionality"

extra:
  recipe-maintainers:
    - traversaro
