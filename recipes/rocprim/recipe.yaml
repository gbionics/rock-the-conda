schema_version: 1

context:
  name: rocprim
  version: "7.2.4"

recipe:
  name: rocprim-split
  version: ${{ version }}

source:
  - url: "https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/rocprim.tar.gz"
    sha256: 3ec26b7ae729aad766366110b3a5341793342ca1351cf4c72d38f28e8f26aa75

build:
  number: 0
  skip: 
    - not linux
    - hip_compiler_version in (None, "None")

outputs:
  - staging:
      name: rocprim-build
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - pkg-config
        - ninja
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake
    build:
      script: build.sh

  - package:
      name: librocprim-devel
    inherit:
      from: rocprim-build
      run_exports: false
    build:
      files:
        - include/**
        - lib/*.a
        - lib/cmake/**
        - lib/pkgconfig/**
        - share/pkgconfig/**
        - share/doc/**
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - pkg-config
        - ninja
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake

      run:
        - hip-devel

      run_exports:
        - ${{ pin_subpackage('librocprim-devel', upper_bound='x.x') }}
    tests:
      - requirements:
          run:
            - cmake-package-check
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
        script:
          - cmake-package-check rocprim
      - package_contents:
          include:
            - ${{ name }}/${{ name }}.hpp

about:
  homepage: https://rocm.docs.amd.com/projects/rocPRIM
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: "rocPRIM is a header-only library that provides HIP parallel primitives."

extra:
  recipe-maintainers:
    - traversaro
