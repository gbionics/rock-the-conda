schema_version: 1

context:
  name: hipblas
  version: "7.2.4"

recipe:
  name: hipblas-split
  version: ${{ version }}

source:
  - url: "https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/hipblas.tar.gz"
    sha256: 5627f0dc9d9bf34a5a3e100312077b275b6fff305c3f25f970824bc1c85a3676

build:
  number: 0
  skip: 
    - not linux
    - hip_compiler_version in (None, "None")

outputs:
  - staging:
      name: hipblas-build
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        # Note: fortran is only required on Linux
        - ${{ compiler('fortran') }}
        - cmake
        - pkg-config
        - ninja
        # Needed by rocm_check_target_ids CMake function
        - lld 22.*
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake
        - rocm-smi
        - libhipblaslt-devel
        - roctracer
        - libhipblas-common-devel
        - librocblas-devel
        - librocsolver-devel
    build:
      script: build.sh

  - package:
      name: libhipblas
    inherit:
      from: hipblas-build
      run_exports: false
    build:
      files:
        - bin/**
        - lib/libhipblas.so*
        - share/doc/**
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        # Note: fortran is only required on Linux
        - ${{ compiler('fortran') }}
        - cmake
        - pkg-config
        - ninja
        # Needed by rocm_check_target_ids CMake function
        - lld 22.*
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake
        - rocm-smi
        - libhipblaslt-devel
        - roctracer
        - libhipblas-common-devel
        - librocblas-devel
        - librocsolver-devel
    tests:
      - package_contents:
          lib:
            - hipblas

  - package:
      name: libhipblas-devel
    inherit:
      from: hipblas-build
      run_exports: false
    build:
      files:
        - include/**
        - lib/*.a
        - lib/cmake/**
        - lib/pkgconfig/**
        - share/pkgconfig/**
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        # Note: fortran is only required on Linux
        - ${{ compiler('fortran') }}
        - cmake
        - pkg-config
        - ninja
        # Needed by rocm_check_target_ids CMake function
        - lld 22.*
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake
        - rocm-smi
        - libhipblaslt-devel
        - roctracer
        - libhipblas-common-devel
        - librocblas-devel
        - librocsolver-devel

      run:
        - hip-devel
        - libhipblaslt-devel
        - libhipblas-common-devel
        - librocblas-devel
        - librocsolver-devel
        - ${{ pin_subpackage('libhipblas', exact=True) }}

      run_exports:
        - ${{ pin_subpackage('libhipblas', upper_bound='x.x') }}
    tests:
      - requirements:
          run:
            - cmake-package-check
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
        script:
          - cmake-package-check hipblas
      - package_contents:
          include:
            - hipblas/hipblas.h

about:
  homepage: https://rocm.docs.amd.com/projects/hipBLAS
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: "ROCm BLAS marshalling library."

extra:
  recipe-maintainers:
    - traversaro
