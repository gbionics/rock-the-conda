schema_version: 1

context:
  name: hipcub
  version: "7.2.4"

package:
  name: libhipcub-devel
  version: ${{ version }}

source:
  url: https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/hipcub.tar.gz
  sha256: 2b08b0e7fc8d97717bc9656a0cc0e502dd221770f34deb8721ced2239939d779

build:
  number: 0
  skip:
    - not linux
    - hip_compiler_version in (None, "None")
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('hip') }}
    - cmake
    - ninja
  host:
    - rocm-core ${{ version }}.*
    - rocm-cmake
    - librocprim-devel ${{ version }}.*
  run:
    - hip-devel
    - librocprim-devel
tests:
  - requirements:
      run:
        - cmake-package-check
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    script:
      - cmake-package-check hipcub
  - package_contents:
      include:
        - hipcub/hipcub.hpp

about:
  repository: https://github.com/ROCm/hipCUB
  homepage: https://rocm.docs.amd.com/projects/hipCUB/en/latest/
  license: MIT
  license_file: LICENSE.txt
  summary: "HIP CUB: thin layer on top of rocPRIM or CUB"

extra:
  feedstock-name: hipcub
  recipe-maintainers:
    - traversaro
