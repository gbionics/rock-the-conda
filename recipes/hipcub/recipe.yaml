schema_version: 1

context:
  name: hipcub
  version: "7.2.4"

recipe:
  name: hipcub-split
  version: ${{ version }}

source:
  url: https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/hipcub.tar.gz
  sha256: 2b08b0e7fc8d97717bc9656a0cc0e502dd221770f34deb8721ced2239939d779

build:
  number: 0
  skip:
    - not linux
    - hip_compiler_version in (None, "None")

outputs:
  - staging:
      name: hipcub-build
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - ninja
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake
        - librocprim-devel ${{ version }}.*
    build:
      script: build.sh

  - package:
      name: libhipcub-devel
    inherit:
      from: hipcub-build
      run_exports: false
    build:
      files:
        - include/**
        - lib/*.a
        - lib/cmake/**
        - lib/pkgconfig/**
        - share/pkgconfig/**
        - share/doc/**
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - ninja
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake
        - librocprim-devel ${{ version }}.*

      run:
        - hip-devel
        - librocprim-devel

      run_exports:
        - ${{ pin_subpackage('libhipcub-devel', upper_bound='x.x') }}
    tests:
      - package_contents:
          include:
            - hipcub/hipcub.hpp
          files:
            - lib/cmake/hipcub/hipcub-config.cmake

about:
  repository: https://github.com/ROCm/hipCUB
  homepage: https://rocm.docs.amd.com/projects/hipCUB/en/latest/
  license: MIT
  license_file: LICENSE.txt
  summary: "HIP CUB: thin layer on top of rocPRIM or CUB"

extra:
  recipe-maintainers:
    - traversaro
