context:
  name: rocm-core
  version: "7.2.4"

recipe:
  name: rocm-core-split
  version: ${{ version }}

source:
  - url: "https://github.com/ROCm/rocm-systems/releases/download/rocm-${{ version }}/rocm-core.tar.gz"
    sha256: 6213466e5d791a492ddc4fe91f2078295468a9d5da11731b0428ce2edc080622

build:
  number: 3
  skip: not linux

outputs:
  - staging:
      name: rocm-core-build
    build:
      script:
        file: build.sh
        env:
          ROCM_VERSION: ${{ version }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja

  - package:
      name: librocm-core
    inherit: rocm-core-build
    build:
      files:
        - lib/librocm-core.so*
    requirements:
      run_exports:
        - ${{ pin_subpackage('librocm-core', upper_bound='x.x') }}
    tests:
      - package_contents:
          lib:
            - rocm-core

  - package:
      name: rocm-core
    inherit: rocm-core-build
    build:
      files:
        include:
          - "**/*"
        exclude:
          - lib/librocm-core.so*
    requirements:
      run:
        - ${{ pin_subpackage('librocm-core', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('rocm-core', upper_bound='x.x') }}
    tests:
      - requirements:
          run:
            - cmake-package-check
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
        script:
          - cmake-package-check rocm-core
      - package_contents:
          include:
            - rocm-core/rocm_version.h
          files:
            exists:
              - .info/version
              - lib/cmake/rocm-core/rocm-core-config.cmake
            not_exists:
              - lib/librocm-core.so*

about:
  homepage: https://github.com/ROCm/rocm-systems
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: "ROCm core package"

extra:
  recipe-maintainers:
    - traversaro
    - isuruf
    - zklaus
