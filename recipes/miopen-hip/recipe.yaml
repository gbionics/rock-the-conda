schema_version: 1

context:
  name: miopen-hip
  version: "7.2.4"
  llvm_major_version: "22"

recipe:
  name: miopen-hip-split
  version: ${{ version }}

source:
  url: https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/miopen.tar.gz
  sha256: 3752c7463cf58f05519b6025b303f54716aa7ff47a36dfbfa71ea4bc1be21411
  patches:
    - 0001-use-private-frugally-deep.patch

build:
  number: 2
  skip:
    - not linux
    - hip_compiler_version in (None, "None")

outputs:
  - staging:
      name: miopen-hip-build
    requirements:
      build:
        - ${{ compiler('clang') }}
        - ${{ stdlib("c") }}
        - ${{ compiler('clangxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - ninja
        - patch
        # Needed by rocm_check_target_ids CMake function
        - lld ${{ llvm_major_version }}.*
      host:
        - rocm-cmake
        - hip-devel
        - hipcc
        - librocblas-devel
        - libhipblas-common-devel
        - libhipblaslt-devel
        - librocrand-devel
        - libcomposable-kernel-devel ${{ version }}.*
        - rocmlir
        - sqlite
        - libboost-devel
        - nlohmann_json
        - bzip2
        - roctracer
        - cpp-half
        - frugally-deep >=0.20.0
        - functionalplus
        - eigen-abi-devel
      ignore_run_exports:
        from_package:
          - frugally-deep
    build:
      script: build.sh

  - package:
      name: libmiopen-hip
    inherit: miopen-hip-build
    build:
      files:
        include:
          - "**/*"
        exclude:
          - include/**
          - lib/*.a
          - lib/cmake/**
          - lib/pkgconfig/**
          - share/pkgconfig/**
          - share/doc/**
    requirements:
      run:
        - hip-runtime-amd
        - librocblas
        - libhipblaslt
        - libcomposable-kernel
        - rocmlir
        - sqlite
        - bzip2

    tests:
      - package_contents:
          lib:
            - libMIOpen
      - requirements:
          run:
            - ${{ compiler('cxx') }}
            - cmake
            - ninja
            - frugally-deep >=0.20.0
            - functionalplus
            - eigen-abi-devel
            - nlohmann_json
        files:
          recipe:
            - test/
          source:
            - fdeep-compat/
        script:
          - cmake -S test -B test-build -G Ninja -DTEST_CONVOLUTION=OFF -DFDEEP_COMPAT_INCLUDE_DIR=${PWD}/fdeep-compat
          - cmake --build test-build
          - ctest --test-dir test-build --output-on-failure

  - package:
      name: libmiopen-hip-devel
    inherit: miopen-hip-build
    build:
      files:
        - include/**
        - lib/*.a
        - lib/cmake/**
        - lib/pkgconfig/**
        - share/pkgconfig/**
        - share/doc/**
    requirements:
      run:
        - hip-devel
        - librocblas-devel
        - libhipblas-common-devel
        - libhipblaslt-devel
        - librocrand-devel
        - libcomposable-kernel-devel
        - libboost-devel
        - ${{ pin_subpackage('libmiopen-hip', exact=True) }}
        - hip-runtime-amd
        - librocblas
        - libhipblaslt
        - libcomposable-kernel
        - rocmlir
        - sqlite
        - bzip2

      run_exports:
        - ${{ pin_subpackage('libmiopen-hip', upper_bound='x.x') }}

    tests:
      - package_contents:
          include:
            - miopen/miopen.h
            - miopen/config.h
      - requirements:
          run:
            - ${{ compiler('cxx') }}
            - cmake
            - ninja
        files:
          recipe:
            - test/
        script:
          - cmake -S test -B test-build -G Ninja -DTEST_AI_MODELS=OFF
          - cmake --build test-build
          - ctest --test-dir test-build --output-on-failure

about:
  repository: https://github.com/ROCm/MIOpen
  license: MIT
  license_file: LICENSE.md
  summary: "AMD's Machine Intelligence Library for ROCm (HIP backend)"
  description: |
    MIOpen is AMD's library for high performance machine learning primitives.
    It provides highly optimized implementations of deep learning operations
    for AMD GPUs using the HIP programming model.

extra:
  feedstock-name: miopen-hip
  recipe-maintainers:
    - flferretti
    - conda-forge/rocm-core
