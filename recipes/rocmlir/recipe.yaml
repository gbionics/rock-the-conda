context:
  name: rocmlir
  version: "7.2.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - git: https://github.com/ROCm/rocMLIR.git
    tag: rocm-${{ version }}
    patches:
      - 0001-fix-mlir-execution-engine-cmake.patch

build:
  number: 2
  skip:
    - not linux
    - hip_compiler_version in (None, "None")

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('hip') }}
    - cmake
    - ninja
    - git
  host:
    - rocm-core ${{ version }}.*
    - rocm-cmake
    - rocr-runtime

tests:
  - package_contents:
      files:
        - lib/librockCompiler.so
        - lib/cmake/rocmlir/rocmlir-config.cmake
        - lib/cmake/rocmlir/rocmlir-targets.cmake
      include:
        - rocmlir/Miir.h
        - rocmlir/external/include/mlir-c/IR.h
        - rocmlir/mlir-c/Dialect/Rock.h
        - rocmlir/mlir-c/Dialect/MIGraphX.h
  - script:
      - grep -q miirCreateHandle ${PREFIX}/lib/librockCompiler.so
      - grep -q mlirContextCreate ${PREFIX}/lib/librockCompiler.so
      - test ! -e ${PREFIX}/lib/librockCompiler.a
      - test -z "$(ls ${PREFIX}/lib/libMLIR*.so* 2>/dev/null)"
      - test ! -e ${PREFIX}/lib/libMLIRRockOps.a

about:
  homepage: https://github.com/ROCm/rocMLIR
  repository: https://github.com/ROCm/rocMLIR
  license: Apache-2.0 WITH LLVM-exception
  license_file: LICENSE.TXT
  summary: ROCm MLIR-based convolution and GEMM kernel generator
  description: |
    rocMLIR is an MLIR-based convolution and GEMM kernel generator for ROCm.
    It provides high-performance compute kernels for machine learning workloads.

extra:
  recipe-maintainers:
    - flferretti
    - conda-forge/rocm-core
