schema_version: 1

context:
  name: rocrand
  version: "7.2.4"

recipe:
  name: rocrand-split
  version: ${{ version }}

source:
  url: https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/rocrand.tar.gz
  sha256: 9b5ddd4ac403e5c1199728750234c37386effbf648aff873910c6f3299beadaf

build:
  number: 0
  skip:
    - not linux
    - hip_compiler_version in (None, "None")

outputs:
  - staging:
      name: rocrand-build
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - ninja
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake
    build:
      script: build.sh

  - package:
      name: librocrand
    inherit:
      from: rocrand-build
      run_exports: false
    build:
      files:
        - bin/**
        - lib/librocrand.so*
        - share/doc/**
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - ninja
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake
    tests:
      - package_contents:
          lib:
            - librocrand

  - package:
      name: librocrand-devel
    inherit:
      from: rocrand-build
      run_exports: false
    build:
      files:
        - include/**
        - lib/*.a
        - lib/cmake/**
        - lib/pkgconfig/**
        - share/pkgconfig/**
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - ninja
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake

      run:
        - hip-devel
        - ${{ pin_subpackage('librocrand', exact=True) }}

      run_exports:
        - ${{ pin_subpackage('librocrand', upper_bound='x.x') }}
    tests:
      - package_contents:
          include:
            - rocrand/rocrand.h
            - rocrand/rocrand_xorwow.h

about:
  repository: https://github.com/ROCm/rocRAND
  license: MIT
  license_file: LICENSE.md
  summary: "ROCm random number generation library"
  description: |
    rocRAND is a library for generating pseudo-random and quasi-random numbers
    on AMD GPUs using the ROCm platform. It provides implementations of various
    random number generators including XORWOW, MRG32K3A, MTGP32, Philox, and Sobol.

extra:
  recipe-maintainers:
    - flferretti
    - conda-forge/rocm-core
